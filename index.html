<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسوق بلس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #090d16; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .box { width: 90%; max-width: 400px; background: #131b2e; padding: 25px; border-radius: 12px; border: 1px solid #23304d; }
        h2 { text-align: center; color: #22c55e; margin-bottom: 20px; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #23304d; background: #090d16; color: white; outline: none; font-size: 14px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        button:hover { background: #059669; }
        .switch { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; cursor: pointer; }
        .switch span { color: #22c55e; font-weight: bold; }
        .hidden { display: none !important; }
        .app-screen { width: 100%; max-width: 600px; padding: 20px; text-align: center; }
        .card { background: #131b2e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #23304d; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginDiv" class="box">
        <h2>تسجيل الدخول - تسوق بلس</h2>
        <div class="group">
            <label>رقم الموبايل</label>
            <input type="text" id="logPhone" value="01032315526">
        </div>
        <div class="group">
            <label>كلمة السر</label>
            <input type="password" id="logPass" value="asmael">
        </div>
        <button onclick="doLogin()">دخول</button>
        <div class="switch" onclick="toggleView()">ليس لديك حساب؟ <span>انشئ حساباً جديداً</span></div>
    </div>

    <!-- شاشة إنشاء حساب -->
    <div id="regDiv" class="box hidden">
        <h2>إنشاء حساب جديد</h2>
        <div class="group">
            <label>اسم المستخدم</label>
            <input type="text" id="regName">
        </div>
        <div class="group">
            <label>رقم الموبايل</label>
            <input type="text" id="regPhone">
        </div>
        <div class="group">
            <label>كلمة السر</label>
            <input type="password" id="regPass">
        </div>
        <button onclick="doRegister()">تسجيل وحفظ</button>
        <div class="switch" onclick="toggleView()">لديك حساب بالفعل؟ <span>تسجيل الدخول</span></div>
    </div>

    <!-- شاشة التطبيق الرئيسية -->
    <div id="appDiv" class="app-screen hidden">
        <div class="card">
            <h2 id="welcomeText" style="margin-bottom:10px;">أهلاً بك</h2>
            <p style="color: #94a3b8; font-size: 13px;" id="phoneText"></p>
        </div>
        <div class="card">
            <div style="font-size: 14px; color: #94a3b8; margin-bottom: 5px;">رصيد الوديعة</div>
            <div style="font-size: 26px; font-weight: bold; color: #22c55e;" id="depositText">0.00 EGP</div>
        </div>
        <button onclick="doLogout()" style="background: #ef4444;">تسجيل الخروج</button>
    </div>

    <script>
        // التحقق من وجود مستخدم مسجل مسبقاً عند فتح الصفحة
        window.onload = function() {
            var activeUser = localStorage.getItem("active_user");
            if (activeUser) {
                showApp(activeUser);
            }
        };

        function getUsers() {
            var data = localStorage.getItem("all_users_db");
            if (!data) {
                var initial = {
                    "01032315526": { name: "الأدمن", pass: "asmael", deposit: 1000 }
                };
                localStorage.setItem("all_users_db", JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function doLogin() {
            var phone = document.getElementById("logPhone").value.trim();
            var pass = document.getElementById("logPass").value.trim();
            var users = getUsers();

            if (users[phone] && users[phone].pass === pass) {
                localStorage.setItem("active_user", phone);
                showApp(phone);
            } else {
                alert("رقم الموبايل أو كلمة السر غير صحيحة!");
            }
        }

        function doRegister() {
            var name = document.getElementById("regName").value.trim();
            var phone = document.getElementById("regPhone").value.trim();
            var pass = document.getElementById("regPass").value.trim();

            if (!name || !phone || !pass) {
                alert("الرجاء ملء كافة الحقول!");
                return;
            }

            var users = getUsers();
            if (users[phone]) {
                alert("رقم الموبايل مسجل مسبقاً!");
                return;
            }

            users[phone] = { name: name, pass: pass, deposit: 0 };
            localStorage.setItem("all_users_db", JSON.stringify(users));
            localStorage.setItem("active_user", phone);
            showApp(phone);
        }

        function showApp(phone) {
            var users = getUsers();
            var user = users[phone];
            if (!user) return;

            document.getElementById("loginDiv").classList.add("hidden");
            document.getElementById("regDiv").classList.add("hidden");
            document.getElementById("appDiv").classList.remove("hidden");

            document.getElementById("welcomeText").innerText = "أهلاً بك، " + user.name;
            document.getElementById("phoneText").innerText = "رقم الموبايل: " + phone;
            document.getElementById("depositText").innerText = user.deposit.toFixed(2) + " EGP";
        }

        function doLogout() {
            localStorage.removeItem("active_user");
            location.reload();
        }

        function toggleView() {
            var log = document.getElementById("loginDiv");
            var reg = document.getElementById("regDiv");
            log.classList.toggle("hidden");
            reg.classList.toggle("hidden");
        }
    </script>
</body>
</html>
