    <script>
        var currentUserPhone = localStorage.getItem('tasawuq_logged_user') || null;
        var usersDB = {};
        
        try {
            usersDB = JSON.parse(localStorage.getItem('tasawuq_users')) || {};
        } catch(e) {
            usersDB = {};
        }

        if (!usersDB['01032315526']) {
            usersDB['01032315526'] = {
                name: 'صاحب الشركة',
                password: 'asmael',
                balance: 0,
                deposit: 0,
                profit: 0,
                subscribed: false,
                subscribedPackage: 'غير مشترك',
                packageRequest: null,
                packageRequestStatus: 'لا يوجد',
                avatar: 'https://via.placeholder.com/150',
                tasksCount: 5,
                completedTasks: {},
                withdrawRequest: null,
                withdrawStatus: 'لا يوجد'
            };
            localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
        }

        function getTodayDateKey() {
            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (currentUserPhone && usersDB[currentUserPhone]) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('registerScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                loadUserData();

                if(currentUserPhone === '01032315526') {
                    document.getElementById('adminNavBtn').classList.remove('hidden');
                    renderAdminPanel();
                } else {
                    document.getElementById('adminNavBtn').classList.add('hidden');
                }
            }
        });

        function showRegister() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function executeRegister() {
            var nameField = document.getElementById('regName');
            var phoneField = document.getElementById('regPhone');
            var passwordField = document.getElementById('regPassword');

            if (!nameField || !phoneField || !passwordField) return;

            var name = nameField.value.trim();
            var phone = phoneField.value.trim();
            var password = passwordField.value.trim();

            if (!name || !phone || !password) {
                alert('الرجاء كتابة الاسم ورقم الموبايل وكلمة السر!');
                return;
            }

            if (usersDB[phone]) {
                alert('رقم الموبايل مسجل بالفعل!');
                showLogin();
                return;
            }

            usersDB[phone] = {
                name: name,
                password: password,
                balance: 0,
                deposit: 0,
                profit: 0,
                subscribed: false,
                subscribedPackage: 'غير مشترك',
                packageRequest: null,
                packageRequestStatus: 'لا يوجد',
                avatar: 'https://via.placeholder.com/150',
                tasksCount: 5,
                completedTasks: {},
                withdrawRequest: null,
                withdrawStatus: 'لا يوجد'
            };
            
            localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
            currentUserPhone = phone;
            localStorage.setItem('tasawuq_logged_user', phone);
            loadUserData();
            
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');
            alert('تم إنشاء الحساب بنجاح!');
        }

        function executeLogin() {
            var phoneField = document.getElementById('loginPhone');
            var passwordField = document.getElementById('loginPassword');

            if (!phoneField || !passwordField) return;

            var phone = phoneField.value.trim();
            var password = passwordField.value.trim();

            if (!usersDB[phone] || usersDB[phone].password !== password) {
                alert('رقم الموبايل أو كلمة السر غير صحيحة!');
                return;
            }

            currentUserPhone = phone;
            localStorage.setItem('tasawuq_logged_user', phone);
            loadUserData();
            
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');

            if(phone === '01032315526') {
                document.getElementById('adminNavBtn').classList.remove('hidden');
                renderAdminPanel();
            } else {
                document.getElementById('adminNavBtn').classList.add('hidden');
            }
        }

        function loadUserData() {
            var data = usersDB[currentUserPhone];
            if (!data) return;
            
            document.getElementById('displayNameHeader').innerText = data.name;
            document.getElementById('displayPhone').innerText = currentUserPhone;
            document.getElementById('displayId').innerText = currentUserPhone.slice(-6) + '8';
            document.getElementById('depositVal').innerText = (data.deposit || 0).toFixed(2);
            document.getElementById('profitVal').innerText = (data.profit || 0).toFixed(2);

            var icon = document.getElementById('headerAvatarIcon');
            var img = document.getElementById('headerAvatarImg');
            if (data.avatar && data.avatar !== 'https://via.placeholder.com/150') {
                img.src = data.avatar;
                img.classList.remove('hidden');
                if (icon) icon.classList.add('hidden');
            } else {
                if (img) img.classList.add('hidden');
                if (icon) icon.classList.remove('hidden');
            }

            var vipBadge = document.getElementById('vipBadge');
            if(vipBadge) {
                if(data.subscribed) {
                    vipBadge.innerText = data.subscribedPackage;
                    vipBadge.classList.remove('hidden');
                } else {
                    vipBadge.classList.add('hidden');
                }
            }

            document.getElementById('accountName').innerText = data.name;
            document.getElementById('accountPhone').innerText = currentUserPhone;
            document.getElementById('accountId').innerText = currentUserPhone.slice(-6) + '8';
            document.getElementById('accountPackage').innerText = data.subscribedPackage || 'غير مشترك';
            document.getElementById('accountDeposit').innerText = (data.deposit || 0).toFixed(2) + ' EGP';
            document.getElementById('accountBalance').innerText = (data.balance || 0).toFixed(2) + ' EGP';
            document.getElementById('userAvatarImg').src = data.avatar || 'https://via.placeholder.com/150';

            updateTasksButtons();
            updateUserWithdrawUI();
            updateUserPackageRequestUI();
        }

        function switchTab(tabName) {
            var tabs = document.querySelectorAll('.tab-content');
            for(var i=0; i<tabs.length; i++) { tabs[i].classList.add('hidden'); }
            
            var navBtns = document.querySelectorAll('.nav-btn');
            for(var j=0; j<navBtns.length; j++) { navBtns[j].classList.remove('active'); }

            if (tabName === 'home') document.getElementById('tabHome').classList.remove('hidden');
            else if (tabName === 'account') document.getElementById('tabAccount').classList.remove('hidden');
            else if (tabName === 'tasks') document.getElementById('tabTasks').classList.remove('hidden');
            else if (tabName === 'transactions') document.getElementById('tabTransactions').classList.remove('hidden');
            else if (tabName === 'orders') document.getElementById('tabOrders').classList.remove('hidden');
            else if (tabName === 'admin') document.getElementById('tabAdmin').classList.remove('hidden');
        }

        function uploadUserAvatar(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    usersDB[currentUserPhone].avatar = evt.target.result;
                    localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                    loadUserData();
                };
                reader.readAsDataURL(file);
            }
        }

        function editUserName() {
            var newName = prompt("ادخل اسم المستخدم الجديد:", usersDB[currentUserPhone].name);
            if (newName && newName.trim() !== "") {
                usersDB[currentUserPhone].name = newName.trim();
                localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                loadUserData();
            }
        }

        function handleLogout() {
            currentUserPhone = null;
            localStorage.removeItem('tasawuq_logged_user');
            document.getElementById('appScreen').classList.add('hidden');
            document.getElementById('bottomNav').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function updateTasksButtons() {
            var u = usersDB[currentUserPhone];
            if(!u) return;
            var todayKey = getTodayDateKey();
            if (!u.completedTasks) u.completedTasks = {};

            var completedToday = u.completedTasks[todayKey] ? u.completedTasks[todayKey].length : 0;
            u.tasksCount = 5 - completedToday;

            for (var i = 1; i <= 5; i++) {
                var btn = document.getElementById('taskBtn' + i);
                if (btn) {
                    if (u.completedTasks[todayKey] && u.completedTasks[todayKey].indexOf(i) !== -1) {
                        btn.disabled = true;
                        btn.innerText = "مكتملة ✓";
                        btn.style.background = "#334155";
                    } else {
                        btn.disabled = false;
                        btn.innerText = "تنفيذ المهمة";
                        btn.style.background = "";
                    }
                }
            }
            var leftEl = document.getElementById('tasksLeft');
            if(leftEl) leftEl.innerText = u.tasksCount;
        }

        function doTask(taskId) {
            var user = usersDB[currentUserPhone];
            if (!user.subscribed) {
                alert('يجب موافقة الأدمن على اشتراك الباقة أولاً!');
                return;
            }
            
            var todayKey = getTodayDateKey();
            if (!user.completedTasks) user.completedTasks = {};
            if (!user.completedTasks[todayKey]) user.completedTasks[todayKey] = [];

            if (user.completedTasks[todayKey].indexOf(taskId) !== -1) {
                alert('تم تنفيذ هذه المهمة اليوم بالفعل!');
                return;
            }

            var dailyTotal = user.deposit === 300 ? 15 : (user.deposit === 800 ? 40 : (user.deposit === 1500 ? 75 : (user.deposit === 3000 ? 150 : (user.deposit === 8000 ? 400 : 600))));
            var taskEarn = dailyTotal / 5;
            user.profit += taskEarn;
            user.completedTasks[todayKey].push(taskId);

            localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
            loadUserData();
            alert('مبروك! تمت المهمة وأُضيف ربح (' + taskEarn.toFixed(2) + ' ج.م).');
        }

        function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

        function savePasswordChange() {
            var newPass = document.getElementById('editPasswordInput').value.trim();
            if (newPass) {
                usersDB[currentUserPhone].password = newPass;
                localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                closeProfileModal();
                alert('تم تغيير كلمة المرور!');
            }
        }

        function openPackagesModal() { document.getElementById('packagesModal').classList.remove('hidden'); }
        function closePackagesModal() { document.getElementById('packagesModal').classList.add('hidden'); }
        function openInfoModal() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfoModal() { document.getElementById('infoModal').classList.add('hidden'); }

        function updateUserWithdrawUI() {
            var data = usersDB[currentUserPhone];
            var statusDiv = document.getElementById('userWithdrawStatus');
            if(statusDiv) {
                statusDiv.innerHTML = data.withdrawRequest ? 'مبلغ السحب: <strong>' + data.withdrawRequest + ' ج.م</strong> - الحالة: <span style="color:var(--accent);">' + data.withdrawStatus + '</span>' : 'لا توجد معاملات سحب معلقة حالياً.';
            }
        }

        function updateUserPackageRequestUI() {
            var data = usersDB[currentUserPhone];
            var box = document.getElementById('userPackageRequestStatus');
            if(box) {
                box.innerHTML = data.packageRequest ? 'الباقة المطلوبة: <strong>باقة ' + data.packageRequest + ' EGP</strong> - الحالة: <span style="color:var(--accent);">' + data.packageRequestStatus + '</span>' : 'لا توجد طلبات اشتراك باقات حالياً.';
            }
        }

        function requestPackageSubscription(price, name) {
            var user = usersDB[currentUserPhone];
            if (user.subscribed) { alert('أنت مشترك بالفعل!'); return; }
            if (user.balance < price) { alert('رصيدك المتاح غير كافٍ للاشتراك!'); return; }

            user.packageRequest = price;
            user.packageRequestStatus = 'قيد المراجعة';
            localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
            loadUserData();
            closePackagesModal();
            alert('تم إرسال طلب الاشتراك بنجاح.');
        }

        function requestWithdrawal() {
            var user = usersDB[currentUserPhone];
            var amount = parseFloat(prompt("ادخل المبلغ المراد سحبه:"));
            if (amount && !isNaN(amount)) {
                user.withdrawRequest = amount;
                user.withdrawStatus = 'قيد المراجعة من الأدمن';
                localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                loadUserData();
                alert('تم إرسال طلب السحب بنجاح!');
            }
        }

        function renderAdminPanel() {
            var tbody = document.getElementById('adminUserTable');
            if(!tbody) return;
            tbody.innerHTML = '';
            for (var phoneKey in usersDB) {
                var u = usersDB[phoneKey];
                tbody.innerHTML += '<tr>' +
                    '<td>' + u.name + '<br><span style="color:var(--neon-green);">' + phoneKey + '</span></td>' +
                    '<td>' + (u.balance || 0).toFixed(2) + ' ج.م</td>' +
                    '<td>' + (u.deposit || 0).toFixed(2) + ' ج.م</td>' +
                    '<td>' + (u.profit || 0).toFixed(2) + ' ج.م</td>' +
                    '<td style="color:var(--accent);">' + (u.packageRequest ? 'باقة ' + u.packageRequest + ' (' + u.packageRequestStatus + ')' : 'لا يوجد') + '</td>' +
                    '<td>' +
                        '<button onclick="adminEditBalance(\'' + phoneKey + '\', \'balance\')" style="background:#2563eb; color:white; border:none; padding:4px 6px; border-radius:4px; cursor:pointer; margin-bottom:2px;">شحن متاح</button> ' +
                        '<button onclick="adminEditBalance(\'' + phoneKey + '\', \'deposit\')" style="background:var(--accent); color:black; border:none; padding:4px 6px; border-radius:4px; cursor:pointer; margin-bottom:2px;">وديعة</button> ' +
                        (u.packageRequestStatus === 'قيد المراجعة' ? '<button onclick="adminApprovePackage(\'' + phoneKey + '\')" style="background:var(--accent); color:black; border:none; padding:4px 6px; border-radius:4px; cursor:pointer;">موافقة الباقة</button>' : '') +
                    '</td>' +
                '</tr>';
            }
        }

        function adminEditBalance(phoneKey, fieldType) {
            var newVal = parseFloat(prompt('ادخل القيمة الجديدة:'));
            if (!isNaN(newVal)) {
                usersDB[phoneKey][fieldType] = newVal;
                if(fieldType === 'deposit' && newVal > 0) {
                    usersDB[phoneKey].subscribed = true;
                    usersDB[phoneKey].subscribedPackage = 'باقة ' + newVal + ' EGP';
                }
                localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                renderAdminPanel();
                if(currentUserPhone === phoneKey) loadUserData();
                alert('تم التحديث بنجاح');
            }
        }

        function adminApprovePackage(phoneKey) {
            var u = usersDB[phoneKey];
            if (u.packageRequest) {
                u.balance = Math.max(0, u.balance - u.packageRequest);
                u.deposit = u.packageRequest;
                u.subscribed = true;
                u.subscribedPackage = 'باقة ' + u.packageRequest + ' EGP';
                u.packageRequestStatus = 'تمت الموافقة ✓';
                localStorage.setItem('tasawuq_users', JSON.stringify(usersDB));
                renderAdminPanel();
                if(currentUserPhone === phoneKey) loadUserData();
                alert('تمت الموافقة وتفعيل الباقة بنجاح!');
            }
        }
    </script>
